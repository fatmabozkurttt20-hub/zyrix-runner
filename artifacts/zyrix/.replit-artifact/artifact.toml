kind = "mobile"
previewPath = "/"
title = "ZYRIX"
version = "1.0.0"
id = "artifacts/zyrix"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21690

[services.development]
run = "pnpm --filter @workspace/zyrix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zyrix", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/zyrix", "run", "serve" ]

[services.env]
PORT = "21690"
BASE_PATH = "/"
