name: ZYRIX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'zyrix-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: zyrix-app/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: zyrix-app
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: zyrix-app
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build APK
        working-directory: zyrix-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZYRIX-APK
          path: zyrix-app/android/app/build/outputs/apk/release/*.apk
