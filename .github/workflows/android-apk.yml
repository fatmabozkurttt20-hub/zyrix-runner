name: ZYRIX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'zyrix-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install app dependencies
        working-directory: zyrix-app
        run: npm install

      - name: Verify Expo
        working-directory: zyrix-app
        run: |
          node -p "require('expo/package.json').version"
          npx --no-install expo --version

      - name: Generate Android project
        working-directory: zyrix-app
        env:
          CI: 1
        run: npx --no-install expo prebuild --platform android --clean

      - name: Build APK
        working-directory: zyrix-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZYRIX-APK
          path: zyrix-app/android/app/build/outputs/apk/release/*.apk
